<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carte du monde à pop-ups imbriqués</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <div id="map"></div>

    <div id="popupOverlay" class="popup-overlay hidden" aria-hidden="true">
      <div class="popup-shell" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
        <div class="popup-header">
          <div class="popup-headline">
            <button id="backBtn" class="icon-btn hidden" type="button" aria-label="Retour">
              ←
            </button>
            <div>
              <h2 id="popupTitle">Titre</h2>
              <p id="popupSubtitle"></p>
            </div>
          </div>

          <div class="popup-actions">
            <button id="closeBtn" class="icon-btn" type="button" aria-label="Fermer">
              ✕
            </button>
          </div>
        </div>

        <div id="popupBody" class="popup-body"></div>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
